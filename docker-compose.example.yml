# ==============================================================================
# 🧭 USENET-KOMPASS - DOCKER COMPOSE TEMPLATE
# Schlüsselfertige Vorlage für deinen automatisierten Medienserver-Stack
# Dokumentation: https://github.com/KAiSER086/Usenet-Kompass
# ==============================================================================

# Wiederverwendbarer Logging-Block gegen unbegrenzt volllaufende Festplatten
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    <<: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # --- VPN Konfiguration (WireGuard / OpenVPN) ---
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER} # z. B. mullvad, protonvpn, surfshark, ivpn, custom
      - VPN_TYPE=${VPN_TYPE}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES} # Deine WireGuard-IP
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS} # Erlaube Zugriff aus lokalem Heimnetz (bei Tailscale: 192.168.178.0/24,100.64.0.0/10)
      - TZ=${TZ}
      - PUID=${PUID} # Deine PUID (Terminal: 'id -u')
      - PGID=${PGID} # Deine PGID (Terminal: 'id -g')
    ports:
      - "${PORT_SABNZBD}:8080" # SABnzbd WebUI (Standard)
      - "${PORT_NZBGET}:6789" # NZBGet WebUI (falls genutzt)
      - "${PORT_RADARR}:7878" # Radarr WebUI & API
      - "${PORT_SONARR}:8989" # Sonarr WebUI & API
      - "${PORT_PROWLARR}:9696" # Prowlarr WebUI & API
    volumes:
      - ${CONFIG_DIR}/gluetun:/gluetun
    restart: unless-stopped

  # --- Usenet Downloader (Wähle SABnzbd ODER NZBGet) ---

  # Option A: SABnzbd (Standard-Empfehlung: Moderne UI, intelligentes Caching & volle Gigabit-Power)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    <<: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sabnzbd:/config
      - ${DATA_DIR}:/data
    restart: unless-stopped
    depends_on:
      - gluetun
    network_mode: "service:gluetun"

  # Option B: NZBGet (Ressourcen-Leichtgewicht für < 2 GB RAM inkl. Direct Unpack)
  # nzbget:
  #   image: lscr.io/linuxserver/nzbget:latest
  #   container_name: nzbget
  #   <<: *default-logging
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
  #     - TZ=${TZ}
  #   volumes:
  #     - ${CONFIG_DIR}/nzbget:/config
  #     - ${DATA_DIR}:/data
  #   restart: unless-stopped
  #   depends_on:
  #     - gluetun
  #   network_mode: "service:gluetun"

  # --- Arr-Stack (Automatisierung & Indexer-Management) ---

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/prowlarr:/config
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/sonarr:/config
      - ${DATA_DIR}:/data
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - sabnzbd # oder nzbget
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/radarr:/config
      - ${DATA_DIR}:/data
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - sabnzbd # oder nzbget
    restart: unless-stopped

  # --- Frontend (Streaming & Media Requests) ---

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    <<: *default-logging
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/jellyfin:/config
      - ${DATA_DIR}/media:/data/media
    # Optional für Intel QuickSync Hardware-Transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107" # GID der Gruppe 'render' auf dem Host ('getent group render | cut -d: -f3')
    ports:
      - "${PORT_JELLYFIN}:8096" # Jellyfin WebUI
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    <<: *default-logging
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${CONFIG_DIR}/seerr:/app/config
    ports:
      - "${PORT_SEERR}:5055" # Seerr WebUI
    depends_on:
      - radarr
      - sonarr
      - gluetun
    restart: unless-stopped
