# ==============================================================================
# 🧭 USENET-KOMPASS - DOCKER COMPOSE TEMPLATE (OHNE VPN / DIREKT-MODUS)
# Schlüsselfertige Vorlage für deinen automatisierten Medienserver-Stack
# Dokumentation: https://github.com/KAiSER086/Usenet-Kompass
# ==============================================================================

# Wiederverwendbarer Logging-Block gegen unbegrenzt volllaufende Festplatten
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  # --- Usenet Downloader (Wähle SABnzbd ODER NZBGet) ---

  # Option A: SABnzbd (Moderne UI, intelligentes Caching & volle Gigabit-Power)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000} # Deine PUID (Terminal: 'id -u')
      - PGID=${PGID:-1000} # Deine PGID (Terminal: 'id -g')
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/sabnzbd:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8080:8080" # SABnzbd WebUI
    restart: unless-stopped

  # Option B: NZBGet (Ressourcen-Leichtgewicht für < 2 GB RAM inkl. Direct Unpack)
  # nzbget:
  #   image: lscr.io/linuxserver/nzbget:latest
  #   container_name: nzbget
  #   <<: *default-logging
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - TZ=${TZ:-Europe/Berlin}
  #   volumes:
  #     - ${CONFIG_DIR:-./config}/nzbget:/config
  #     - ${DATA_DIR:-./data}:/data
  #   ports:
  #     - "6789:6789" # NZBGet WebUI
  #   restart: unless-stopped

  # --- Arr-Stack (Automatisierung & Indexer-Management) ---

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    ports:
      - "9696:9696" # Prowlarr WebUI & API
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8989:8989" # Sonarr WebUI & API
    depends_on:
      - sabnzbd # oder nzbget
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:-./data}:/data
    ports:
      - "7878:7878" # Radarr WebUI & API
    depends_on:
      - sabnzbd # oder nzbget
    restart: unless-stopped

  # --- Frontend (Streaming & Media Requests) ---

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      - ${DATA_DIR:-./data}/media:/data/media
    # Optional für Intel QuickSync / VAAPI Hardware-Transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107" # GID der Gruppe 'render' auf dem Host (getent group render | cut -d: -f3)
    ports:
      - "8096:8096" # Jellyfin WebUI
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    <<: *default-logging
    init: true
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/seerr:/app/config
    ports:
      - "5055:5055" # Seerr WebUI
    depends_on:
      - radarr
      - sonarr
    restart: unless-stopped
