# ==============================================================================
# 🧭 USENET-KOMPASS - DOCKER COMPOSE TEMPLATE
# Schlüsselfertige Vorlage für deinen automatisierten Medienserver-Stack
# Dokumentation: https://github.com/KAiSER086/Usenet-Kompass
# ==============================================================================

# Wiederverwendbarer Logging-Block gegen unbegrenzt volllaufende Festplatten
x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    <<: *default-logging
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      # --- VPN Konfiguration (WireGuard / OpenVPN) ---
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-mullvad} # z. B. mullvad, protonvpn, surfshark, ivpn, custom
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-dein-wireguard-private-key}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-10.64.0.1/32} # Deine WireGuard-IP
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Netherlands,Germany}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS:-192.168.178.0/24} # Erlaube Zugriff aus lokalem Heimnetz (bei Tailscale: 192.168.178.0/24,100.64.0.0/10)
      - TZ=${TZ:-Europe/Berlin}
      - PUID=${PUID:-1000} # Deine PUID (Terminal: 'id -u')
      - PGID=${PGID:-1000} # Deine PGID (Terminal: 'id -g')
    ports:
      - "8080:8080" # SABnzbd WebUI (Standard)
      - "6789:6789" # NZBGet WebUI (falls genutzt)
      - "7878:7878" # Radarr WebUI & API
      - "8989:8989" # Sonarr WebUI & API
      - "9696:9696" # Prowlarr WebUI & API
    volumes:
      - ${CONFIG_DIR:-./config}/gluetun:/gluetun
    restart: unless-stopped

  # --- Usenet Downloader (Wähle SABnzbd ODER NZBGet) ---

  # Option A: SABnzbd (Standard-Empfehlung: Moderne UI, intelligentes Caching & volle Gigabit-Power)
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/sabnzbd:/config
      - ${DATA_DIR:-./data}:/data
    restart: unless-stopped
    depends_on:
      - gluetun
    network_mode: "service:gluetun"

  # Option B: NZBGet (Ressourcen-Leichtgewicht für < 2 GB RAM inkl. Direct Unpack)
  # nzbget:
  #   image: lscr.io/linuxserver/nzbget:latest
  #   container_name: nzbget
  #   <<: *default-logging
  #   environment:
  #     - PUID=${PUID:-1000}
  #     - PGID=${PGID:-1000}
  #     - TZ=${TZ:-Europe/Berlin}
  #   volumes:
  #     - ${CONFIG_DIR:-./config}/nzbget:/config
  #     - ${DATA_DIR:-./data}:/data
  #   restart: unless-stopped
  #   depends_on:
  #     - gluetun
  #   network_mode: "service:gluetun"

  # --- Arr-Stack (Automatisierung & Indexer-Management) ---

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/prowlarr:/config
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/sonarr:/config
      - ${DATA_DIR:-./data}:/data
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - sabnzbd # oder nzbget
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/radarr:/config
      - ${DATA_DIR:-./data}:/data
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
      - sabnzbd # oder nzbget
    restart: unless-stopped

  # --- Frontend (Streaming & Media Requests) ---

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    <<: *default-logging
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/jellyfin:/config
      - ${DATA_DIR:-./data}/media:/data/media
    # Optional für Intel QuickSync Hardware-Transcoding:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "107" # GID der Gruppe 'render' auf dem Host ('getent group render | cut -d: -f3')
    ports:
      - "8096:8096"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    <<: *default-logging
    init: true
    environment:
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ${CONFIG_DIR:-./config}/seerr:/app/config
    ports:
      - "5055:5055"
    depends_on:
      - radarr
      - sonarr
      - gluetun
    restart: unless-stopped
